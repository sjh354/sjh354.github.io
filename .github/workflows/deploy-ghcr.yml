name: Build and Deploy to sjh354.xyz

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "INSTALL.md"
      - "CUSTOMIZE.md"
      - "lighthouse_results/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ghcr
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blog:latest
            ghcr.io/${{ github.repository_owner }}/blog:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Trigger server deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SERVER_DISPATCH_TOKEN }}
          repository: sjh354/mainserver
          event-type: blog-updated
