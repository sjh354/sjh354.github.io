name: Build and Deploy to sjh354.xyz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify documentation-only changes
        id: changes
        run: python3 scripts/ci_changes.py --github

  build:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ghcr
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blog:latest
            ghcr.io/${{ github.repository_owner }}/blog:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Trigger server deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SERVER_DISPATCH_TOKEN }}
          repository: sjh354/infra
          event-type: deploy-request
          client-payload: '{"service": "blog", "sha": "${{ github.sha }}"}'
